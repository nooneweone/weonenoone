<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="/favicon.ico">
  <title>WeOneNoOne.org</title>

  <style>
    body {
      background-color: #f8f9fb;
      color: #222;
      font-family: "Inter", "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 0;
    }

    header {
      background: white;
      border-bottom: 1px solid #e2e2e2;
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a1a;
    }

    nav a {
      margin-left: 1rem;
      text-decoration: none;
      color: #3366cc;
      font-weight: 500;
    }

    nav a:hover {
      text-decoration: underline;
    }

    main {
      display: flex;
      justify-content: center;
      padding: 3rem 1rem;
    }

    .content {
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      padding: 2.5rem;
      max-width: 720px;
      width: 100%;
    }

    h2 {
      color: #003366;
      font-size: 1.4rem;
      border-bottom: 1px solid #e2e2e2;
      padding-bottom: 0.5rem;
      margin-top: 1.8rem;
    }

    p {
      line-height: 1.7;
      color: #333;
    }

    .highlight {
      background-color: #eef3ff;
      border-left: 4px solid #3366cc;
      padding: 1rem 1.2rem;
      margin: 1.2rem 0;
      color: #003366;
      font-style: italic;
    }

    .definition {
      background-color: #fffaf3;
      border-left: 4px solid #ffa726;
      padding: 1rem 1.2rem;
      margin: 1.5rem 0;
      color: #6a4500;
      font-style: italic;
    }

    .loop-link {
      background-color: #f1f8ff;
      border-left: 4px solid #4da3ff;
      padding: 1rem 1.2rem;
      margin: 2rem 0;
      color: #003a7d;
      border-radius: 6px;
    }

    .loop-link a {
      color: #175bd2;
      font-weight: bold;
      text-decoration: none;
    }

    .loop-link a:hover {
      text-decoration: underline;
    }

    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #666;
    }

    .lang-btn {
      margin-top: 1.5rem;
      padding: 0.3rem 0.6rem;
      font-size: 0.9rem;
      background: transparent;
      border: 1px solid #ccc;
      border-radius: 50%;
      cursor: pointer;
      color: #666;
    }

    header h1.logo {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0;
    }
    
    header h1.logo img {
      width: 32px;
      height: 32px;
      display: block;
    }

    /* Modal base */
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      z-index: 9999;
    }
    
    /* Dim background */
    .modal-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.6);
    }
    
    /* Centered content */
    .modal-content {
      position: relative;
      z-index: 1;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .modal-content img {
      max-width: 90vw;
      max-height: 90vh;
      border-radius: 12px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    
    /* Cursor hint */
    #logoTrigger {
      cursor: pointer;
    }    
    
  </style>
</head>

<body>

<header>
  
</header>

<main>
  <div class="content">
    <h2 id="about">About WeOneNoOne</h2>
    <p>
     
    </p>  
  </div>
</main>


 
</body>
</html>
